name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with Docker (al-folio image)
        run: |
          docker run --rm \
            -e JEKYLL_ENV=production \
            -v "${{ github.workspace }}:/srv/jekyll" \
            -v "${{ github.workspace }}/vendor/bundle:/usr/local/bundle" \
            amirpourmand/al-folio:v0.13.4 \
            bash -lc "bundle install --no-cache && bundle exec jekyll build --trace"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
