name: Update Publications

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch new publications from Google Scholar
        run: python scripts/update_publications_from_scholar.py --merge

      - name: Commit and push if papers.bib changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --cached --quiet && echo "No new publications found." || \
            (git commit -m "Auto-update publications from Google Scholar" && git push)
