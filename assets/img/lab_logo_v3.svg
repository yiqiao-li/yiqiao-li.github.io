<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <clipPath id="c">
      <circle cx="75" cy="75" r="67"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="75" cy="75" r="70" fill="#1B365D"/>

  <!-- ── ROAD & VEHICLE ── -->
  <g clip-path="url(#c)">
    <!-- Road surface -->
    <rect x="5" y="120" width="140" height="30" fill="white" opacity="0.08"/>
    <!-- Road edge line -->
    <rect x="5" y="120" width="140" height="3" fill="white"/>
    <!-- Lane dashes -->
    <line x1="22" y1="131" x2="128" y2="131"
          stroke="white" stroke-width="2" stroke-dasharray="13,9" opacity="0.35"/>

    <!-- Car body -->
    <rect x="28" y="80" width="94" height="40" rx="6" fill="white"/>
    <!-- Cabin / greenhouse -->
    <rect x="44" y="61" width="62" height="21" rx="5" fill="white"/>
    <!-- Rear window -->
    <rect x="48" y="65" width="25" height="14" rx="2" fill="#1B365D"/>
    <!-- Front window -->
    <rect x="77" y="65" width="25" height="14" rx="2" fill="#1B365D"/>
    <!-- Wheel arch cutouts -->
    <circle cx="52"  cy="110" r="13" fill="#1B365D"/>
    <circle cx="98"  cy="110" r="13" fill="#1B365D"/>
    <!-- Tyre rings -->
    <circle cx="52"  cy="110" r="11" fill="#1B365D" stroke="white" stroke-width="2.5"/>
    <circle cx="98"  cy="110" r="11" fill="#1B365D" stroke="white" stroke-width="2.5"/>
    <!-- Wheel hubs -->
    <circle cx="52"  cy="110" r="3.5" fill="white"/>
    <circle cx="98"  cy="110" r="3.5" fill="white"/>
  </g>

  <!-- ── LiDAR SCAN BEAMS from rooftop sensor (75, 61) ── -->
  <g clip-path="url(#c)" stroke="#F7941D" stroke-linecap="round" fill="none">
    <line x1="75" y1="61" x2="75"  y2="19" stroke-width="1.8" opacity="0.90"/>
    <line x1="75" y1="61" x2="62"  y2="21" stroke-width="1.6" opacity="0.85"/>
    <line x1="75" y1="61" x2="88"  y2="21" stroke-width="1.6" opacity="0.85"/>
    <line x1="75" y1="61" x2="50"  y2="27" stroke-width="1.4" opacity="0.70"/>
    <line x1="75" y1="61" x2="100" y2="27" stroke-width="1.4" opacity="0.70"/>
    <line x1="75" y1="61" x2="41"  y2="36" stroke-width="1.2" opacity="0.50"/>
    <line x1="75" y1="61" x2="109" y2="36" stroke-width="1.2" opacity="0.50"/>
    <!-- Neural arc connecting scan endpoints -->
    <polyline points="41,36 50,27 62,21 75,19 88,21 100,27 109,36"
              stroke-width="1.3" opacity="0.50" fill="none"/>
  </g>

  <!-- ── SCAN POINT NODES (AI data points) ── -->
  <g fill="#F7941D" clip-path="url(#c)">
    <circle cx="75"  cy="19" r="4.5"/>
    <circle cx="62"  cy="21" r="4.0"/>
    <circle cx="88"  cy="21" r="4.0"/>
    <circle cx="50"  cy="27" r="3.5"/>
    <circle cx="100" cy="27" r="3.5"/>
    <circle cx="41"  cy="36" r="3.0" opacity="0.85"/>
    <circle cx="109" cy="36" r="3.0" opacity="0.85"/>
  </g>

  <!-- Rooftop LiDAR sensor -->
  <circle cx="75" cy="61" r="5.5" fill="#F7941D"/>
  <circle cx="75" cy="61" r="2.5" fill="white"/>

  <!-- Outer accent ring -->
  <circle cx="75" cy="75" r="70" fill="none" stroke="#F7941D" stroke-width="4.5"/>
</svg>
